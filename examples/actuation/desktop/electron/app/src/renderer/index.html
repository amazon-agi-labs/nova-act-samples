<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Task Manager</h1>
  <p class="subtitle">An example Electron app for Nova Act to automate</p>

  <div class="add-task">
    <input type="text" id="task-input" placeholder="What needs to be done?" aria-label="New task description">
    <select id="priority-select" aria-label="Task priority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <button id="add-btn">Add Task</button>
  </div>

  <div class="filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="completed">Completed</button>
  </div>

  <ul class="task-list" id="task-list"></ul>

  <div class="stats" id="stats"></div>

  <script src="app.js"></script>
</body>
</html>
