<!DOCTYPE html>
<html>
<head>
    <title>Click Actuation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: center;
        }
        button {
            padding: 20px 40px;
            font-size: 18px;
            cursor: pointer;
        }
        .counter {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <button id="singleClick">Single Click Me!</button>
        <div id="singleCounter" class="counter">Single Clicks: 0</div>

        <button id="doubleClick">Double Click Me!</button>
        <div id="doubleCounter" class="counter">Double Clicks: 0</div>

        <button id="rightClick">Right Click Me!</button>
        <div id="rightCounter" class="counter">Right Clicks: 0</div>
    </div>

    <script>
        let singleCount = 0;
        let doubleCount = 0;
        let rightCount = 0;

        const singleButton = document.getElementById('singleClick');
        const doubleButton = document.getElementById('doubleClick');
        const rightButton = document.getElementById('rightClick');
        const singleCounter = document.getElementById('singleCounter');
        const doubleCounter = document.getElementById('doubleCounter');
        const rightCounter = document.getElementById('rightCounter');

        singleButton.addEventListener('click', () => {
            singleCount++;
            singleCounter.textContent = `Single Clicks: ${singleCount}`;
        });

        doubleButton.addEventListener('dblclick', () => {
            doubleCount++;
            doubleCounter.textContent = `Double Clicks: ${doubleCount}`;
        });

        rightButton.addEventListener('contextmenu', (e) => {
            rightCount++;
            rightCounter.textContent = `Right Clicks: ${rightCount}`;
        });
    </script>
</body>
</html>
