<!DOCTYPE html>
<html>
<head>
    <title>Hover Actuation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: center;
        }
        button {
            padding: 20px 40px;
            font-size: 18px;
            cursor: pointer;
        }
        .counter {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <button id="hoverTarget" title="You found the tooltip!">Hover Over Me!</button>
        <div id="hoverCounter" class="counter">Hovers: 0</div>
    </div>

    <script>
        let hoverCount = 0;

        const hoverButton = document.getElementById('hoverTarget');
        const hoverCounter = document.getElementById('hoverCounter');

        hoverButton.addEventListener('mouseenter', () => {
            hoverCount++;
            hoverCounter.textContent = `Hovers: ${hoverCount}`;
        });
    </script>
</body>
</html>
